<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders</title>
</head>
<body>
    <nav>
        <a href="index.html">Home</a> |
        <a href="warehouses.html">Warehouses</a> |
        <a href="products.html">Products</a> |
        <a href="orders.html"><b>Orders</b></a>
    </nav>
    <h1>Orders</h1>
    <button id="btn-add">+ Add Order</button>
    <p id="error" style="color:red;display:none;"></p>
    <p><i>Click an order row to expand its line items.</i></p>

    <table border="1" cellpadding="6" id="orders-table">
        <thead>
            <tr>
                <th></th>
                <th>Order ID</th>
                <th>Warehouse</th>
                <th>Date</th>
                <th>Status</th>
                <th>Subtotal</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>

    <!-- Order Modal -->
    <div id="modal" style="display:none; position:fixed; top:20%; left:50%; transform:translateX(-50%); background:white; border:1px solid #ccc; padding:20px; z-index:10; min-width:300px;">
        <h3 id="modal-title">Order</h3>
        <label>Warehouse:
            <select id="field-warehouse"></select>
        </label><br><br>
        <label>Order Date: <input id="field-date" type="date"></label><br><br>
        <label>Status:
            <select id="field-status">
                <option>Pending</option>
                <option>Shipped</option>
                <option>Delivered</option>
                <option>Cancelled</option>
            </select>
        </label><br><br>
        <button id="modal-save">Save</button>
        <button id="modal-cancel">Cancel</button>
    </div>

    <!-- Order Item Modal -->
    <div id="item-modal" style="display:none; position:fixed; top:20%; left:50%; transform:translateX(-50%); background:white; border:1px solid #ccc; padding:20px; z-index:10; min-width:300px;">
        <h3 id="item-modal-title">Order Item</h3>
        <label>Product:
            <select id="item-field-product"></select>
        </label><br><br>
        <label>Quantity: <input id="item-field-qty" type="number" min="1" value="1"></label><br><br>
        <label>Unit Price: <input id="item-field-price" type="number" step="0.01" min="0"></label><br><br>
        <button id="item-modal-save">Save</button>
        <button id="item-modal-cancel">Cancel</button>
    </div>

    <script src="js/api.js"></script>
    <script src="js/orders.js"></script>
</body>
</html>
