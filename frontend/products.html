<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
</head>
<body>
    <nav>
        <a href="index.html">Home</a> |
        <a href="warehouses.html">Warehouses</a> |
        <a href="products.html"><b>Products</b></a> |
        <a href="orders.html">Orders</a>
    </nav>
    <h1>Products</h1>
    <button id="btn-add">+ Add Product</button>
    <p id="error" style="color:red;display:none;"></p>

    <table border="1" cellpadding="6">
        <thead>
            <tr>
                <th>SKU</th>
                <th>Name</th>
                <th>Description</th>
                <th>Unit Price</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>

    <!-- Modal -->
    <div id="modal" style="display:none; position:fixed; top:30%; left:50%; transform:translateX(-50%); background:white; border:1px solid #ccc; padding:20px; z-index:10;">
        <h3 id="modal-title">Product</h3>
        <label>SKU: <input id="field-sku" type="text"></label><br><br>
        <label>Name: <input id="field-name" type="text"></label><br><br>
        <label>Description: <input id="field-description" type="text"></label><br><br>
        <label>Unit Price: <input id="field-price" type="number" step="0.01" min="0"></label><br><br>
        <button id="modal-save">Save</button>
        <button id="modal-cancel">Cancel</button>
    </div>

    <script src="js/api.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
